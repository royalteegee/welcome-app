name: my first cicd

on:
  push:
    branches: [main]

jobs:
  push-to-s3:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID}}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: go and clone the repo
        run: git clone https://github.com/royalteegee/welcome-app.git
      - name: copy to s3 bucket
        run: aws s3 sync ./welcome-app s3://smarthub-testing --exclude ".git/*"
